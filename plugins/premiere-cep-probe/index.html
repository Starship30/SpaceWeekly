<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>SpaceWeekly 单卡验证</title>
<style>body{background:#292929;color:#eee;font:14px sans-serif;padding:14px}input,button{display:block;margin:12px 0;max-width:100%}pre{white-space:pre-wrap;overflow:auto}label input{display:inline}</style>
<h3>Premiere 26.3 单卡验证（实验）</h3>
<p>仅验证 JSON 第 1 条。失败即停止，保留片段，不重试、不保存工程。</p>
<label>SpaceWeekly JSON<input id="json" type="file" accept=".json"></label>
<label>现有 MOGRT<input id="mogrt" type="file" accept=".mogrt"></label>
<label><input id="dedicated" type="checkbox">当前序列是本次测试的专用空序列</label>
<button id="bind">绑定当前项目和空序列</button><pre id="target">未绑定</pre>
<label>秒数<input id="seconds" type="number" value="8" min="0.01" step="0.1"></label>
<button id="run">执行一次单卡验证</button><pre id="log" role="log" aria-live="polite"></pre>
<button id="inspect">读取当前单卡控件（只读）</button>
<script src="panel.js"></script></html>
